<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'" />
    <title>pokebuddy</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기에서만 선명하다.
         Galmuri11 은 12·24px, Galmuri14 는 15px, Galmuri9 는 10px 로만 쓴다 (worklog/records/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri14";
        src: url("../../assets/fonts/Galmuri14.woff2") format("woff2");
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../assets/fonts/Galmuri9.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-small: "Galmuri9", "Galmuri11", "Malgun Gothic", sans-serif;
        --font-large: "Galmuri14", "Galmuri11", "Malgun Gothic", sans-serif;
        /* 굵은 파일이 없는 Galmuri14·9 를 가짜로 굵게 만들면 도트가 뭉개진다 */
        font-synthesis: none;
      }
      /* 앱이 그리는 메뉴 — Figma `Context Menu` `338:738`, 항목 `Menu Item` `337:319`. 색은 관리 창과 같은 `PB / Color` 변수다 */
      :root {
        --surface: #ffffff;
        --accent-bg: #ebf4f1;
        --ink: #1a3330;
        --muted: #4a6663;
        --disabled: #9ca3af;
        --line: #dde1db;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      /* 여백 8 은 그림자 자리다 — src/main/menu-window.ts SHADOW 와 같다 */
      body {
        padding: 8px;
        display: inline-block;
        color: var(--ink);
        font: 12px/18px var(--font-body);
        -webkit-user-select: none;
        user-select: none;
      }
      #menu {
        width: 200px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 4px 12px rgba(26, 51, 48, 0.16);
        outline: none;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 34px;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .item .label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item .hint {
        flex: none;
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
      }
      .item.on {
        background: var(--accent-bg);
      }
      .item:disabled {
        color: var(--disabled);
        cursor: default;
      }
      /* 맨 위 이름·상태 — 굵은 이름과 흐린 상태 두 줄 */
      .status {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 12px;
      }
      .status .title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status .caption {
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
      }
      .separator {
        padding: 4px 0;
      }
      .separator::before {
        content: "";
        display: block;
        height: 1px;
        background: var(--line);
      }
    </style>
  </head>
  <body>
    <div id="menu" role="menu" tabindex="-1"></div>
    <script type="module" src="../../dist/renderer/menu.js"></script>
  </body>
</html>
