<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>pokebuddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* 알림 배너 — Figma `Notification Banner` `338:732`. 색은 관리 창과 같은 `PB / Color` 변수다 */
      :root {
        --subtle: #dde1db;
        --ink: #1a3330;
        --muted: #4a6663;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 8px;
        color: var(--ink);
        font: 12px/16px var(--font-body);
        user-select: none;
      }
      .banner {
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(26, 51, 48, 0.12);
      }
      .banner[hidden] {
        display: none;
      }
      /* 제목 줄 — 제목과 오른쪽 `✕`. 높이 18 그대로라 배너 280 × 82 가 바뀌지 않는다 (Figma `Notification Banner` `338:732` 각 변형의 `title-row`) */
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .title {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
        line-height: 18px;
        font-weight: 600;
      }
      .line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .target {
        width: 28px;
        height: 28px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 업적 — 둥근 네모 안의 글자 */
      .target.achievement {
        background: var(--subtle);
        border-radius: 8px;
        color: var(--muted);
        font-size: 10px;
        font-family: var(--font-small);
        line-height: 14px;
        font-weight: 600;
      }
      /* 부화 — 알 윤곽 */
      .target.hatch::before {
        content: "";
        width: 20px;
        height: 24px;
        border: 4px solid var(--subtle);
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      }
      /* 진화·메가스톤 — 원형 초상 자리 */
      .target.evolve,
      .target.mega {
        background: var(--accent-bg);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      .target.evolve::before,
      .target.mega::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--ink);
      }
      .name {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* 안내·줍기 — 대상 그림 없이 두 줄까지. 두 줄(16px × 2)이 단추 높이 32px 와 같아 배너 창 높이가 그대로다 */
      .target.notice,
      .target.find {
        display: none;
      }
      .name.wrap {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: keep-all;
      }
      /* 닫기 — 아이콘 16px, 누르는 범위 20px(음수 여백으로 자리는 16 그대로) — 2026-09-30 사용자 요청 */
      .close {
        flex: none;
        width: 20px;
        height: 20px;
        margin: -2px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .close:hover {
        color: var(--ink);
      }
      .close:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
      }
      .close svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .go {
        flex: none;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--inverse);
        font: inherit;
        font-size: 12px;
        line-height: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .go:hover {
        background: var(--primary-hover);
      }
      .go:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="banner" id="banner" role="status" aria-live="polite" hidden>
      <div class="title-row">
        <div class="title" id="title"></div>
        <button class="close" id="close" type="button" aria-label="닫기" title="닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="line">
        <div class="target" id="target" aria-hidden="true"></div>
        <div class="name" id="name"></div>
        <button class="go" id="go" type="button"></button>
      </div>
    </div>
    <script type="module" src="../../dist/web/renderer/windows/banner.js"></script>
  </body>
</html>
