<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>pokebuddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/banner.css" />
  </head>
  <body>
    <div class="banner" id="banner" role="status" aria-live="polite" hidden>
      <div class="title-row">
        <div class="title" id="title"></div>
        <button class="close" id="close" type="button" aria-label="닫기" title="닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="line">
        <div class="target" id="target" aria-hidden="true"></div>
        <div class="name" id="name"></div>
        <button class="go" id="go" type="button"></button>
      </div>
    </div>
    <script type="module" src="../../dist/web/renderer/windows/banner.js"></script>
  </body>
</html>
