<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; media-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기에서만 선명하다.
         Galmuri11 은 12·24px, Galmuri14 는 15px, Galmuri9 는 10px 로만 쓴다 (worklog/records/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../assets/fonts/Galmuri9.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-small: "Galmuri9", "Galmuri11", "Malgun Gothic", sans-serif;
        font-synthesis: none;
      }
      /* 파티 기기 — 교체 화면. Figma 05 `Party / Swap · Open` `1248:2567` (worklog/records/party-preset/record.md).
         틀은 가방·상점 기기 창과 같다. 기기의 회청색은 그림처럼 정해진 색이라 관리 창 변수에 묶지 않는다.
         도감(빨강)·개체 상세(청록)·상점(호박색)·가방(파랑)과 가른다 */
      :root {
        --body: #5f6f85;
        --hinge: #424f61;
        --joint: #2f3947;
        --paper: #ffffff;
        --records: #fbfaf6;
        --ink: #3b2c31;
        --soft: #5a534c;
        --inverse: #ffffff;
        --line: #dde1db;
        --subtle: #dde1db;
        --primary: #0f766e;
        --accent: #ebf4f1;
        --danger-ink: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-body);
        font-size: 12px;
        line-height: 18px;
        color: var(--ink);
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .device {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 380px;
        padding: 14px 16px 16px 26px;
        background: var(--body);
        border-radius: 6px 18px 18px 6px;
        box-shadow:
          inset -4px -6px 0 rgba(47, 57, 71, 0.55),
          inset 3px 3px 0 rgba(190, 204, 224, 0.45);
        overflow: hidden;
      }
      /* 관리 창 왼쪽에 붙으면 경첩 면을 오른쪽에 그린다 */
      .device.left {
        padding: 14px 26px 16px 16px;
        border-radius: 18px 6px 6px 18px;
      }
      .hinge {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 12px;
        background: var(--hinge);
      }
      .device.left .hinge {
        left: auto;
        right: 0;
      }
      .hinge::before,
      .hinge::after {
        content: "";
        position: absolute;
        left: 2px;
        width: 8px;
        height: 24px;
        border-radius: 3px;
        background: var(--joint);
      }
      .hinge::before {
        top: 60px;
      }
      .hinge::after {
        bottom: 60px;
      }
      /* 윗줄 — 창을 끄는 손잡이. 단추는 끌기에서 뺀다 */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }
      .light {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #8fe0d6;
        box-shadow: 0 0 0 3px #ffffff;
      }
      .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .top .title {
        margin-left: auto;
        font-weight: 700;
        color: var(--inverse);
      }
      .close {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(0, 0, 0, 0.15);
      }
      /* 판 — 프리셋 이름, 2열 3행 파티 칸, 프리셋 칩 (Figma `party-panel`) */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      /* 머리 줄 — 프리셋 이름. 실패 문구는 같은 줄 오른쪽에 보인다. 줄을 끼우지 않는다 (2026-09-30 레이아웃 흔들림 금지) */
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .panel-head .name {
        font-weight: 700;
        white-space: nowrap;
      }
      .panel-head .note {
        min-width: 0;
        margin-left: auto;
        color: var(--danger-ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slots {
        display: grid;
        grid-template-columns: repeat(2, 153px);
        gap: 8px;
      }
      .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 108px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        cursor: pointer;
      }
      .slot .face {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        overflow: hidden;
      }
      /* 그림이 없을 때만 원형 자리 표시 — 그림이 있으면 바탕 없이 그림만 (2026-10-03 사용자 결정 "원형 저거 굳이 없어도 될거같아" · "다 빼봐") */
      .slot .face:empty {
        border-radius: 50%;
        background: var(--accent);
      }
      .slot .face img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-view-box: inset(14%);
        image-rendering: pixelated;
      }
      .slot .who {
        font-weight: 700;
      }
      .slot .lv,
      .slot .hint {
        color: var(--soft);
        line-height: 16px;
      }
      /* 빈 칸·잠긴 칸 — 아이콘 상자와 이름. 파티 탭의 빈 칸·잠긴 칸과 같은 구성이다 */
      .slot .icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--accent);
      }
      .slot .icon svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .slot.locked {
        border-color: transparent;
        background: var(--subtle);
        cursor: default;
      }
      /* 가리킨 칸 — 박스에서 가리킨 칸과 같은 옅은 바탕. 초상 원·아이콘 상자는 흰 바탕으로 바꿔 묻히지 않게 한다. 잠긴 칸은 그대로다 */
      .slot:not(.locked):hover {
        background: var(--accent);
      }
      .slot:not(.locked):hover .face,
      .slot:not(.locked):hover .icon,
      .slot.target .icon {
        background: var(--paper);
      }
      /* 든 개체의 원래 칸 — 흐리게. 놓을 칸 — 옅은 바탕 (테두리 강조는 쓰지 않는다) */
      .slot.held > * {
        opacity: 0.35;
      }
      .slot.target {
        border-color: transparent;
        background: var(--accent);
      }
      /* 프리셋 칩 — 지금 프리셋만 채운다. 사지 않은 프리셋은 자물쇠 칩 */
      .presets {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .presets button {
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 28px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        line-height: 16px;
        cursor: pointer;
      }
      .presets button[aria-pressed="true"] {
        border-color: transparent;
        background: var(--primary);
        color: var(--inverse);
        font-weight: 700;
      }
      .presets button:disabled {
        border-color: transparent;
        background: var(--subtle);
        color: var(--soft);
        cursor: default;
      }
      .presets svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="device" class="device"></div>
    <script type="module" src="../../dist/renderer/party.js"></script>
  </body>
</html>
