<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; media-src data:" />
    <title>pokebuddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* 도감 기기 — Figma `99 · 시안` `579:20134`(해금) · `579:20212`(미해금). 기기 그림은 새로 그린 것이다(공식 도감 그림 아님).
         기기의 빨강·화면 색은 그림처럼 정해진 색이라 관리 창 변수에 묶지 않는다 */
      :root {
        --body: #d33a40;
        --hinge: #9e2229;
        --joint: #7a171d;
        --bar: #e25050;
        --ink: #3b2c31;
        --muted: #8a8378;
        --evo-current: #ebf4f1; /* 진화 카드의 지금 종 — 상점 구매 창 트리와 같은 톤 (Figma 변수 113:268) */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-body);
        font-size: 12px;
        line-height: 18px;
        color: var(--ink);
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .device {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 380px;
        padding: 14px 16px 16px 26px;
        background: var(--body);
        border-radius: 6px 18px 18px 6px;
        box-shadow:
          inset -4px -6px 0 rgba(115, 13, 20, 0.55),
          inset 3px 3px 0 rgba(255, 153, 153, 0.45);
        overflow: hidden;
      }
      /* 관리 창 왼쪽에 붙으면 경첩 면을 오른쪽에 그린다 */
      .device.left {
        padding: 14px 26px 16px 16px;
        border-radius: 18px 6px 6px 18px;
      }
      .hinge {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 12px;
        background: var(--hinge);
      }
      .device.left .hinge {
        left: auto;
        right: 0;
      }
      .hinge::before,
      .hinge::after {
        content: "";
        position: absolute;
        left: 2px;
        width: 8px;
        height: 24px;
        border-radius: 3px;
        background: var(--joint);
      }
      .hinge::before {
        top: 60px;
      }
      .hinge::after {
        bottom: 60px;
      }
      /* 윗줄 — 창을 끄는 손잡이. 단추는 끌기에서 뺀다 */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }
      .light {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #8fe0d6;
        box-shadow: 0 0 0 3px #ffffff;
      }
      .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .top .title {
        margin-left: auto;
        font-weight: 700;
        color: var(--inverse);
      }
      .close {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(0, 0, 0, 0.15);
      }
      .bezel {
        padding: 8px;
        border-radius: 12px;
        background: var(--bezel);
      }
      .screen {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 10px;
        border-radius: 6px;
        background: var(--screen);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bar);
        color: var(--inverse);
        font-weight: 700;
      }
      .bar .state {
        margin-left: auto;
        font-family: var(--font-small);
        font-size: 10px;
        font-weight: 400;
        color: #ffe4e4;
      }
      .entry {
        display: flex;
        gap: 10px;
        padding: 0 10px;
      }
      .stage {
        display: grid;
        place-items: center;
        flex: none;
        width: 150px;
        height: 124px;
        border-radius: 6px;
        background: var(--stage);
      }
      .stage {
        overflow: hidden;
      }
      /* 도트 그림 — 빈 테두리를 잘라 정수 배로 키운 캔버스 (ui/portrait.ts spriteCanvas) */
      .stage canvas {
        image-rendering: pixelated;
      }
      /* 미해금 — 모양만 검게 보인다 (2026-09-27 사용자 결정 "모든 미해금에 다 하자") */
      .locked .stage canvas {
        filter: brightness(0);
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .types {
        display: flex;
        gap: 4px;
      }
      .type {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--unknown);
        color: var(--ink);
        font-family: var(--font-small);
        font-size: 10px;
        white-space: nowrap;
      }
      .measure {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--paper);
      }
      .measure div {
        display: flex;
        justify-content: space-between;
      }
      .measure .key {
        color: var(--muted);
      }
      .flavor {
        margin: 0 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--paper);
      }
      .records {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .records div {
        display: flex;
        gap: 10px;
      }
      .records .key {
        flex: none;
        width: 84px;
        font-weight: 700;
      }
      .records .value {
        color: var(--soft);
        min-width: 0;
      }
      /* 진화 카드 — 기록 칸과 같은 판. 트리 모양은 상점 구매 창과 같고(src/renderer/ui/evo-tree.ts) 폭만 기기에 맞췄다 (Figma 05 `Dex / Device / Unlocked` `1091:23559`) */
      .evo-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .evo-label {
        font-weight: 700;
      }
      .evo-none {
        color: var(--soft);
      }
      .evo-branch,
      .evo-row {
        display: flex;
        align-items: center;
      }
      .evo-card > .evo-branch {
        align-self: center;
      }
      .evo-kids {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .evo-node {
        flex: none;
        width: 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 4px;
        border-radius: 10px;
        text-align: center;
      }
      .evo-node.current {
        background: var(--evo-current);
      }
      /* 진화 트리 초상 — 원형 바탕 없이 그림만 (2026-10-03 사용자 결정 "원형 저거 굳이 없어도 될거같아" · "다 빼봐") */
      .evo-node .portrait {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 미해금 종 — 그림을 검은 실루엣으로 (2026-10-02 사용자 결정, Figma `Evo Node` `State=Locked` `1379:3`) */
      .evo-node .portrait.locked .art {
        filter: brightness(0);
      }
      .evo-node .art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-view-box: inset(14%);
        image-rendering: pixelated;
      }
      .evo-name {
        font-size: 12px;
        white-space: nowrap;
      }
      .evo-node.current .evo-name {
        font-weight: 700;
      }
      .evo-need {
        font-family: var(--font-small);
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .evo-step {
        flex: none;
        width: 46px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .evo-arrow {
        flex: none;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .evo-radial {
        position: relative;
        align-self: center;
      }
      .evo-radial .evo-node {
        position: absolute;
        transform: translate(-50%, -50%);
        width: auto;
        min-width: 64px;
        padding: 2px 4px;
        gap: 2px;
      }
      .evo-radial-arrows {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      .controls button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 15px;
        background: var(--bezel);
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .controls .cry {
        flex: 1;
      }
      .controls button:hover:not(:disabled) {
        background: #56424a;
      }
      .controls button:disabled {
        background: #8a6a70;
        cursor: default;
      }
      /* 타입 색 — 관리 창 `.type[data-type]` 과 같은 Scarlet·Violet 팔레트. 색 있는 배지 글자는 모두 흰색 (2026-09-30 사용자 결정) */
      .type[data-type] { color: var(--inverse); }
      .type[data-type="electric"] { background: #fac000; }
      .type[data-type="fire"] { background: #e52829; color: var(--inverse); }
      .type[data-type="flying"] { background: #81b9ef; }
      .type[data-type="bug"] { background: #91a119; }
      .type[data-type="dark"] { background: #624d4e; color: var(--inverse); }
      .type[data-type="dragon"] { background: #5060e1; color: var(--inverse); }
      .type[data-type="fairy"] { background: #ef70ef; }
      .type[data-type="fighting"] { background: #ff8000; }
      .type[data-type="ghost"] { background: #704170; color: var(--inverse); }
      .type[data-type="grass"] { background: #358722; color: var(--inverse); }
      .type[data-type="ground"] { background: #915121; color: var(--inverse); }
      .type[data-type="ice"] { background: #3dcef3; }
      .type[data-type="normal"] { background: #9fa19f; }
      .type[data-type="poison"] { background: #9141cb; color: var(--inverse); }
      .type[data-type="psychic"] { background: #d53a6c; color: var(--inverse); }
      .type[data-type="rock"] { background: #afa981; }
      .type[data-type="steel"] { background: #60a1b8; }
      .type[data-type="water"] { background: #2675db; color: var(--inverse); }
    </style>
  </head>
  <body>
    <div id="device" class="device"></div>
    <script type="module" src="../../dist/web/renderer/device/dex.js"></script>
  </body>
</html>
