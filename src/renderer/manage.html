<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:" />
    <title>pokebuddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/type-badge.css" />
    <link rel="stylesheet" href="styles/move-pill.css" />
    <link rel="stylesheet" href="styles/evo-tree.css" />
    <link rel="stylesheet" href="styles/manage/base.css" />
    <link rel="stylesheet" href="styles/manage/party.css" />
    <link rel="stylesheet" href="styles/manage/adventure.css" />
    <link rel="stylesheet" href="styles/manage/widgets.css" />
    <link rel="stylesheet" href="styles/bubble.css" />
    <link rel="stylesheet" href="styles/manage/evolve.css" />
    <link rel="stylesheet" href="styles/manage/daycare.css" />
    <link rel="stylesheet" href="styles/manage/box.css" />
    <link rel="stylesheet" href="styles/manage/shop-bag.css" />
    <link rel="stylesheet" href="styles/manage/dex.css" />
    <link rel="stylesheet" href="styles/manage/dialog.css" />
    <link rel="stylesheet" href="styles/manage/mail.css" />
    <link rel="stylesheet" href="styles/manage/settings.css" />
    <link rel="stylesheet" href="styles/manage/achievements.css" />
    <link rel="stylesheet" href="styles/manage/trade.css" />
    <link rel="stylesheet" href="styles/manage/pet-box-panel.css" />
    <link rel="stylesheet" href="styles/manage/move-pick.css" />
    <link rel="stylesheet" href="styles/manage/account.css" />
    <link rel="stylesheet" href="styles/coach.css" />
  </head>
  <body>
    <header>
      <span class="brand"
        ><svg class="brand-logo" viewBox="0 0 128 128" aria-hidden="true">
          <defs>
            <linearGradient id="brand-logo-tile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#304d6b" />
              <stop offset="1" stop-color="#18283f" />
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brand-logo-tile)" />
          <rect x="22" y="24" width="84" height="72" rx="13" fill="#111b2d" stroke="#e9f0f2" stroke-width="5" />
          <path d="M24 42h80" stroke="#e9f0f2" stroke-width="5" />
          <circle cx="35" cy="33" r="4" fill="#ff6b62" />
          <circle cx="48" cy="33" r="4" fill="#ffd66f" />
          <circle cx="61" cy="33" r="4" fill="#63d6ad" />
          <path d="M38 59h9l-6 6 6 6M54 72h22" fill="none" stroke="#63d6ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M54 59h18" stroke="#8fa3bb" stroke-width="4" stroke-linecap="round" />
          <circle cx="95" cy="88" r="24" fill="#fff" />
          <path d="M71 88A24 24 0 0 1 119 88Z" fill="#e3484c" />
          <circle cx="95" cy="88" r="24" fill="none" stroke="#111b2d" stroke-width="6" />
          <path d="M72 88h46" stroke="#111b2d" stroke-width="6" />
          <circle cx="95" cy="88" r="9" fill="#fff" stroke="#111b2d" stroke-width="5" /></svg
        >PokeBuddy</span
      >
      <span class="spacer"></span>
      <button type="button" class="save-chip" id="save-indicator" hidden title="계정 저장"></button>
      <span class="day-gauge" id="day-gauge" role="img"></span>
      <span class="point-chip" title="보유 포인트" aria-label="보유 포인트">
        <span class="coin" aria-hidden="true"
          ><svg width="18" height="18" viewBox="0 0 18 18" shape-rendering="crispEdges"><path d="M6 4h1v1h-1zM7 4h1v1h-1zM8 4h1v1h-1zM9 4h1v1h-1zM10 4h1v1h-1zM11 4h1v1h-1zM6 5h1v1h-1zM7 5h1v1h-1zM11 5h1v1h-1zM12 5h1v1h-1zM6 6h1v1h-1zM7 6h1v1h-1zM11 6h1v1h-1zM12 6h1v1h-1zM6 7h1v1h-1zM7 7h1v1h-1zM11 7h1v1h-1zM12 7h1v1h-1zM6 8h1v1h-1zM7 8h1v1h-1zM11 8h1v1h-1zM12 8h1v1h-1zM6 9h1v1h-1zM7 9h1v1h-1zM8 9h1v1h-1zM9 9h1v1h-1zM10 9h1v1h-1zM11 9h1v1h-1zM6 10h1v1h-1zM7 10h1v1h-1zM6 11h1v1h-1zM7 11h1v1h-1zM6 12h1v1h-1zM7 12h1v1h-1zM6 13h1v1h-1zM7 13h1v1h-1z" fill="currentColor" /></svg
        ></span>
        <span class="points" id="points">0</span>
      </span>
    </header>
    <nav>
      <div class="tabs" id="tabs"></div>
      <span class="spacer"></span>
      <div class="nav-actions">
        <button type="button" class="icon" id="open-achievements" title="업적창">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M6 3h8v4a4 4 0 0 1-8 0V3Z" />
            <path d="M6 4H4v1a3 3 0 0 0 3 3M14 4h2v1a3 3 0 0 1-3 3" />
            <path d="M10 11v3M7.5 16h5" />
          </svg>
          <span class="dot" id="achievements-dot" hidden></span>
        </button>
        <!-- 우편함 — 편지와 선물. 업적과 사용자 사이 (Figma 05 Screens 섹션 `10 우편함` `932:22859`, `Icon / Mail` `907:578`, `Primary Navigation` `208:542`). 서버 설정이 없으면 숨긴다 -->
        <button type="button" class="icon" id="open-mail" title="우편함" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.5 5.5h13v9h-13z" />
            <path d="M3.5 5.5l6.5 5 6.5-5" />
          </svg>
          <span class="dot" id="mail-dot" hidden></span>
        </button>
        <!-- 사용자 — 계정·연결 모달을 연다. 우편함과 설정 사이 (2026-09-28 사용자 "설정옆에 유저아이콘 추가", 2026-10-07 순서 변경) -->
        <button type="button" class="icon" id="open-user" title="사용자">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="7" r="3.2" />
            <path d="M3.8 17c.6-3.2 3.1-5 6.2-5s5.6 1.8 6.2 5" />
          </svg>
        </button>
        <!-- 설정 — 톱니바퀴. 톱니 여덟 개(끝 반지름 7.6, 뿌리 5.7)를 바깥 윤곽 한 줄로 그리고 가운데 구멍을 둔다 (2026-09-28 사용자 "설정아이콘 변경"). 맨 오른쪽 (2026-10-07 사용자 "업적-우편함-사용자-설정 순서로") -->
        <button type="button" class="icon" id="open-settings" title="설정">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M8.14 4.61L8.29 2.59L11.71 2.59L11.86 4.61A5.7 5.7 0 0 1 12.50 4.88L14.03 3.55L16.45 5.97L15.12 7.50A5.7 5.7 0 0 1 15.39 8.14L17.41 8.29L17.41 11.71L15.39 11.86A5.7 5.7 0 0 1 15.12 12.50L16.45 14.03L14.03 16.45L12.50 15.12A5.7 5.7 0 0 1 11.86 15.39L11.71 17.41L8.29 17.41L8.14 15.39A5.7 5.7 0 0 1 7.50 15.12L5.97 16.45L3.55 14.03L4.88 12.50A5.7 5.7 0 0 1 4.61 11.86L2.59 11.71L2.59 8.29L4.61 8.14A5.7 5.7 0 0 1 4.88 7.50L3.55 5.97L5.97 3.55L7.50 4.88A5.7 5.7 0 0 1 8.14 4.61Z"
            />
            <circle cx="10" cy="10" r="2.5" />
          </svg>
        </button>
      </div>
    </nav>
    <main id="body"></main>

    <div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>

    <script type="module" src="../../dist/web/renderer/manage/manage.js"></script>
  </body>
</html>
