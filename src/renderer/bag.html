<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; media-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기에서만 선명하다.
         Galmuri11 은 12·24px, Galmuri14 는 15px, Galmuri9 는 10px 로만 쓴다 (worklog/records/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../assets/fonts/Galmuri9.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-small: "Galmuri9", "Galmuri11", "Malgun Gothic", sans-serif;
        font-synthesis: none;
      }
      /* 가방 기기 — Figma 05 `Bag / Device / Use`·`Sell`·`Evolution` (worklog/records/bag-device/record.md). 상점 기기 창(shop.html)과 같은 틀이다.
         기기의 파랑·화면 색은 그림처럼 정해진 색이라 관리 창 변수에 묶지 않는다. 도감(빨강)·파티(초록)·상점(호박색)과 가른다 */
      :root {
        --body: #4f78b8;
        --hinge: #34578f;
        --joint: #243f6b;
        --bezel: #3b2c31;
        --screen: #f5f3ea;
        --bar: #6a93d0;
        --stage: #e6e3d5;
        --paper: #ffffff;
        --records: #fbfaf6;
        --ink: #3b2c31;
        --muted: #8a8378;
        --soft: #5a534c;
        --unknown: #d5d2c6;
        --inverse: #ffffff;
        --line: #dde1db;
        --canvas: #f1f2ee;
        --primary: #0f766e;
        --primary-hover: #0a5f56;
        --disabled: #9ca3af;
        --danger-bg: #fdecec;
        --danger-ink: #b91c1c;
        --success-bg: #e6f6ef;
        --success-ink: #047857;
        --accent: #ebf4f1;
        --picked: #dcebe5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-body);
        font-size: 12px;
        line-height: 18px;
        color: var(--ink);
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .device {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 380px;
        padding: 14px 16px 16px 26px;
        background: var(--body);
        border-radius: 6px 18px 18px 6px;
        box-shadow:
          inset -4px -6px 0 rgba(36, 63, 107, 0.55),
          inset 3px 3px 0 rgba(170, 200, 245, 0.45);
        overflow: hidden;
      }
      /* 관리 창 왼쪽에 붙으면 경첩 면을 오른쪽에 그린다 */
      .device.left {
        padding: 14px 26px 16px 16px;
        border-radius: 18px 6px 6px 18px;
      }
      .hinge {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 12px;
        background: var(--hinge);
      }
      .device.left .hinge {
        left: auto;
        right: 0;
      }
      .hinge::before,
      .hinge::after {
        content: "";
        position: absolute;
        left: 2px;
        width: 8px;
        height: 24px;
        border-radius: 3px;
        background: var(--joint);
      }
      .hinge::before {
        top: 60px;
      }
      .hinge::after {
        bottom: 60px;
      }
      /* 윗줄 — 창을 끄는 손잡이. 단추는 끌기에서 뺀다 */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }
      .light {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #8fe0d6;
        box-shadow: 0 0 0 3px #ffffff;
      }
      .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .top .title {
        margin-left: auto;
        font-weight: 700;
        color: var(--inverse);
      }
      .close {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(0, 0, 0, 0.15);
      }
      .bezel {
        padding: 8px;
        border-radius: 12px;
        background: var(--bezel);
      }
      .screen {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 10px;
        border-radius: 6px;
        background: var(--screen);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bar);
        color: var(--inverse);
        font-weight: 700;
      }
      .bar .state {
        margin-left: auto;
        font-family: var(--font-small);
        font-size: 10px;
        font-weight: 400;
        color: #e6efff;
      }
      .entry {
        display: flex;
        gap: 10px;
        padding: 0 10px;
      }
      .stage {
        display: grid;
        place-items: center;
        flex: none;
        width: 150px;
        height: 124px;
        border-radius: 6px;
        background: var(--stage);
      }
      .stage {
        overflow: hidden;
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .measure {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--paper);
      }
      .measure div {
        display: flex;
        justify-content: space-between;
      }
      .measure .key {
        color: var(--muted);
      }
      .flavor {
        margin: 0 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--paper);
      }
      .records {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .records div {
        display: flex;
        gap: 10px;
      }
      .records .key {
        flex: none;
        width: 84px;
        font-weight: 700;
      }
      .records .value {
        color: var(--soft);
        min-width: 0;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      .controls button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 15px;
        background: var(--bezel);
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .controls .cry {
        flex: 1;
      }
      .controls button:hover:not(:disabled) {
        background: #56424a;
      }
      .controls button:disabled {
        background: #8a6a70;
        cursor: default;
      }
      .controls .go {
        flex: 1;
        background: var(--primary);
      }
      .controls .go:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .controls .go:disabled {
        background: var(--disabled);
      }
      /* 처리 중 — 글자 대신 점 세 개, 폭 그대로 (docs/specs/ui-components.md 처리 중) */
      .controls .go.is-busy {
        color: transparent;
        position: relative;
      }
      .controls .go.is-busy::after {
        content: "···";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--inverse);
      }
      /* 그림 — 빈 테두리를 잘라 정수 배로 키운 캔버스 (shop.ts sprite) */
      .stage canvas {
        image-rendering: pixelated;
      }
      /* 조작 칸 — 기록 칸과 같은 판. 머리 줄(제목·사용|판매), 파티 줄, 수량, 미리보기 상자 (Figma `use`) */
      .use-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .use-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .use-head .title {
        margin-right: auto;
        font-weight: 700;
      }
      /* 사용 | 판매 — 고른 쪽만 톤 배경 (관리 창 segmented 와 같은 모양) */
      .seg {
        display: flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
      .seg button {
        height: 24px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--soft);
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--ink);
        font-weight: 700;
      }
      /* 파티 줄 — 초상 40 + 레벨. 고른 칸만 옅은 배경, 테두리 없음 (Figma `party-strip`) */
      .party {
        display: flex;
        gap: 4px;
      }
      .party button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 50px;
        padding: 6px 4px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--soft);
        cursor: pointer;
      }
      .party button[aria-pressed="true"] {
        background: var(--picked);
        color: var(--ink);
        font-weight: 700;
      }
      .party .face {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        overflow: hidden;
      }
      .party .face img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-view-box: inset(14%);
        image-rendering: pixelated;
      }
      .party-empty {
        color: var(--soft);
      }
      /* 파티 줄과 양끝의 ◀ ▶ — 프리셋이 둘 이상일 때만. 화살표 폭 22, 파티 6칸이 그 사이에 들어가게 칸 폭 42·간격 3
         (Figma 05 `Bag / Device / Use` `1242:1896`, 2026-10-02 사용자 결정). 줄 높이는 파티 칸 높이로 고정한다 */
      .party-row {
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        min-height: 72px;
      }
      .party-row .party-empty {
        flex: 1;
        align-self: center;
        padding: 0 8px;
      }
      .preset-step {
        flex: none;
        width: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--line);
        cursor: pointer;
      }
      .preset-step:hover {
        background: var(--picked);
      }
      .party.tight {
        flex: 1;
        gap: 3px;
        margin: 0 1px; /* 6칸(267) + 좌우 1 = 269 ≤ 314 − 화살표 44 */
      }
      .party.tight button {
        width: 42px;
        padding: 6px 1px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        cursor: pointer;
      }
      .qty button.max {
        width: auto;
        padding: 0 12px;
        font-weight: 700;
      }
      .qty button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .qty .count {
        min-width: 32px;
        text-align: center;
      }
      .qty .hint {
        min-width: 0;
        color: var(--soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .total {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--canvas);
        color: var(--soft);
      }
      .total strong {
        color: var(--ink);
      }
      /* 실패·막힘 — 새 줄 대신 같은 상자의 색 (2026-09-30 레이아웃 흔들림 금지) */
      .total.bad {
        background: var(--danger-bg);
        color: var(--danger-ink);
      }
      .total.bad strong,
      .total.ok strong {
        color: inherit;
      }
      .total.ok {
        background: var(--success-bg);
        color: var(--success-ink);
      }
    </style>
  </head>
  <body>
    <div id="device" class="device"></div>
    <script type="module" src="../../dist/renderer/bag.js"></script>
  </body>
</html>
