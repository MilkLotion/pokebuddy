<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; media-src data:" />
    <title>pokebuddy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <style>
      /* 가방 기기 — Figma 05 `Bag / Device / Use`·`Sell`·`Evolution` (worklog/records/bag-device/record.md). 상점 기기 창(shop.html)과 같은 틀이다.
         기기의 파랑·화면 색은 그림처럼 정해진 색이라 관리 창 변수에 묶지 않는다. 도감(빨강)·파티(초록)·상점(호박색)과 가른다 */
      :root {
        --body: #4f78b8;
        --hinge: #34578f;
        --joint: #243f6b;
        --bar: #6a93d0;
        --ink: #3b2c31;
        --muted: #8a8378;
        --picked: #dcebe5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-body);
        font-size: 12px;
        line-height: 18px;
        color: var(--ink);
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .device {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 380px;
        padding: 14px 16px 16px 26px;
        background: var(--body);
        border-radius: 6px 18px 18px 6px;
        box-shadow:
          inset -4px -6px 0 rgba(36, 63, 107, 0.55),
          inset 3px 3px 0 rgba(170, 200, 245, 0.45);
        overflow: hidden;
      }
      /* 관리 창 왼쪽에 붙으면 경첩 면을 오른쪽에 그린다 */
      .device.left {
        padding: 14px 26px 16px 16px;
        border-radius: 18px 6px 6px 18px;
      }
      .hinge {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 12px;
        background: var(--hinge);
      }
      .device.left .hinge {
        left: auto;
        right: 0;
      }
      .hinge::before,
      .hinge::after {
        content: "";
        position: absolute;
        left: 2px;
        width: 8px;
        height: 24px;
        border-radius: 3px;
        background: var(--joint);
      }
      .hinge::before {
        top: 60px;
      }
      .hinge::after {
        bottom: 60px;
      }
      /* 윗줄 — 창을 끄는 손잡이. 단추는 끌기에서 뺀다 */
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }
      .light {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #8fe0d6;
        box-shadow: 0 0 0 3px #ffffff;
      }
      .led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .top .title {
        margin-left: auto;
        font-weight: 700;
        color: var(--inverse);
      }
      .close {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(0, 0, 0, 0.15);
      }
      .bezel {
        padding: 8px;
        border-radius: 12px;
        background: var(--bezel);
      }
      .screen {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-bottom: 10px;
        border-radius: 6px;
        background: var(--screen);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: var(--bar);
        color: var(--inverse);
        font-weight: 700;
      }
      .bar .state {
        margin-left: auto;
        font-family: var(--font-small);
        font-size: 10px;
        font-weight: 400;
        color: #e6efff;
      }
      .entry {
        display: flex;
        gap: 10px;
        padding: 0 10px;
      }
      .stage {
        display: grid;
        place-items: center;
        flex: none;
        width: 150px;
        height: 124px;
        border-radius: 6px;
        background: var(--stage);
      }
      .stage {
        overflow: hidden;
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .measure {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--paper);
      }
      .measure div {
        display: flex;
        justify-content: space-between;
      }
      .measure .key {
        color: var(--muted);
      }
      .flavor {
        margin: 0 10px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--paper);
      }
      .records {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .records div {
        display: flex;
        gap: 10px;
      }
      .records .key {
        flex: none;
        width: 84px;
        font-weight: 700;
      }
      .records .value {
        color: var(--soft);
        min-width: 0;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      .controls button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 15px;
        background: var(--bezel);
        color: var(--inverse);
        font-weight: 700;
        cursor: pointer;
      }
      .controls .cry {
        flex: 1;
      }
      .controls button:hover:not(:disabled) {
        background: #56424a;
      }
      .controls button:disabled {
        background: #8a6a70;
        cursor: default;
      }
      .controls .go {
        flex: 1;
        background: var(--primary);
      }
      .controls .go:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .controls .go:disabled {
        background: var(--disabled);
      }
      /* 처리 중 — 글자 대신 점 세 개, 폭 그대로 (docs/specs/ui-components.md 처리 중) */
      .controls .go.is-busy {
        color: transparent;
        position: relative;
      }
      .controls .go.is-busy::after {
        content: "···";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--inverse);
      }
      /* 그림 — 빈 테두리를 잘라 정수 배로 키운 캔버스 (ui/portrait.ts spriteCanvas) */
      .stage canvas {
        image-rendering: pixelated;
      }
      /* 조작 칸 — 기록 칸과 같은 판. 머리 줄(제목·사용|판매), 파티 줄, 수량, 미리보기 상자 (Figma `use`) */
      .use-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--records);
      }
      .use-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .use-head .title {
        margin-right: auto;
        font-weight: 700;
      }
      /* 프리셋 넘김 — ◀ 이름 ▶. 프리셋이 둘 이상일 때만. 단추는 22×22 (Figma 03 `Bag Device` `State=Use` 머리 줄, 2026-10-02 사용자 결정 B안) */
      .preset-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        margin-right: auto;
      }
      .preset-nav .title {
        margin-right: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preset-step {
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--line);
        cursor: pointer;
      }
      .preset-step:hover {
        background: var(--picked);
      }
      /* 사용 | 판매 — 고른 쪽만 톤 배경 (관리 창 segmented 와 같은 모양) */
      .seg {
        display: flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
      .seg button {
        height: 24px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--soft);
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--ink);
        font-weight: 700;
      }
      /* 파티 줄 — 초상 40 + 레벨. 고른 칸만 옅은 배경, 테두리 없음 (Figma `party-strip`) */
      .party {
        flex: 1;
        display: flex;
        gap: calc((100% - 300px) / 5); /* 6칸(50×6)이 폭 전체에 고르게 — 칸이 적어도 간격은 같다 */
      }
      .party button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 50px;
        padding: 6px 4px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--soft);
        cursor: pointer;
      }
      .party button[aria-pressed="true"] {
        background: var(--picked);
        color: var(--ink);
        font-weight: 700;
      }
      .party .face {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        overflow: hidden;
      }
      /* 그림이 없을 때만 원형 자리 표시 — 그림이 있으면 바탕 없이 그림만 (2026-10-03 사용자 결정 "원형 저거 굳이 없어도 될거같아" · "다 빼봐") */
      .party .face:empty {
        border-radius: 50%;
        background: var(--accent);
      }
      .party .face img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-view-box: inset(14%);
        image-rendering: pixelated;
      }
      .party-empty {
        color: var(--soft);
      }
      /* 파티 줄 — 칸 폭 전체. 줄 높이는 파티 칸 높이로 고정한다(빈 파티 안내도 같은 높이) */
      .party-row {
        display: flex;
        align-items: stretch;
        min-height: 72px;
      }
      .party-row .party-empty {
        flex: 1;
        align-self: center;
        padding: 0 8px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        cursor: pointer;
      }
      .qty button.max {
        width: auto;
        padding: 0 12px;
        font-weight: 700;
      }
      .qty button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .qty .count {
        min-width: 32px;
        text-align: center;
      }
      .qty .hint {
        min-width: 0;
        color: var(--soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .total {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--canvas);
        color: var(--soft);
      }
      .total strong {
        color: var(--ink);
      }
      /* 실패·막힘 — 새 줄 대신 같은 상자의 색 (2026-09-30 레이아웃 흔들림 금지) */
      .total.bad {
        background: var(--danger-bg);
        color: var(--danger-ink);
      }
      .total.bad strong,
      .total.ok strong {
        color: inherit;
      }
      .total.ok {
        background: var(--success-bg);
        color: var(--success-ink);
      }
    </style>
  </head>
  <body>
    <div id="device" class="device"></div>
    <script type="module" src="../../dist/web/renderer/device/bag.js"></script>
  </body>
</html>
