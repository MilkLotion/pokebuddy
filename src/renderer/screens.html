<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'" />
    <title>놀이공간 화면 고르기</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기(와 그 정수배)에서만 선명하다.
         Galmuri11 은 12px, Galmuri14 는 15px 의 정수배로만 쓴다 (worklog/records/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri14";
        src: url("../../assets/fonts/Galmuri14.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-large: "Galmuri14", "Galmuri11", "Malgun Gothic", sans-serif;
        font-synthesis: none;
        /* 색은 관리 창·영역 그리기 창과 같은 `PB / Color` 변수다 */
        --surface: #ffffff;
        --ink: #1a3330;
        --muted: #4a6663;
        --accent-bg: #ebf4f1;
        --line: #dde1db;
        --primary: #0f766e;
        --scrim: rgba(26, 51, 48, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font: 12px/1.5 var(--font-body);
        -webkit-user-select: none;
        user-select: none;
      }
      /* 고르기 — 화면 전체를 어둡게 하고 어디를 눌러도 이 화면을 고른다 */
      body.pick {
        background: var(--scrim);
        cursor: pointer;
      }
      /* 번호 카드 — 강조는 옅은 배경(accent-bg)으로만 한다. 경계는 중립 1px 선 */
      #card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 240px;
        padding: 24px 32px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(26, 51, 48, 0.25);
      }
      body.pick:hover #card {
        background: var(--accent-bg);
      }
      #number {
        font: 120px/1 var(--font-large);
        color: var(--primary);
      }
      #label {
        font-weight: 700;
      }
      #hint {
        color: var(--muted);
      }
      #hint[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="number"></div>
      <div id="label"></div>
      <div id="hint" hidden>이 화면을 누르면 여기서 놀아요 · Esc 취소</div>
    </div>
    <script type="module" src="../../dist/renderer/screens.js"></script>
  </body>
</html>
