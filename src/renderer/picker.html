<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기에서만 선명하다.
         Galmuri11 은 12·24px, Galmuri14 는 15px, Galmuri9 는 10px 로만 쓴다 (worklog/records/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri14";
        src: url("../../assets/fonts/Galmuri14.woff2") format("woff2");
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../assets/fonts/Galmuri9.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-small: "Galmuri9", "Galmuri11", "Malgun Gothic", sans-serif;
        --font-large: "Galmuri14", "Galmuri11", "Malgun Gothic", sans-serif;
        /* 굵은 파일이 없는 Galmuri14·9 를 가짜로 굵게 만들면 도트가 뭉개진다 */
        font-synthesis: none;
      }
      /* 첫 포켓몬 선택 — Figma `First Run / Starter Selected` `402:9417`, `Starter Empty` `402:9579`.
         색은 관리 창과 같은 `PB / Color` 변수다. 문구·이름은 메인이 언어에 맞춰 넘긴다 (picker.ts) */
      :root {
        --canvas: #f1f2ee;
        --surface: #ffffff;
        --accent-bg: #ebf4f1;
        --ink: #1a3330;
        --muted: #4a6663;
        --inverse: #ffffff;
        --line: #dde1db;
        --primary: #0f766e;
        --primary-hover: #0a5f56;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 20px;
        padding: 24px 20px 20px;
        background: var(--canvas);
        color: var(--ink);
        font: 12px/1.5 var(--font-body);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-family: var(--font-body);
        line-height: normal;
        font-weight: 500;
      }
      /* 카드 목록만 스크롤한다. Figma 는 5열 × 112 + 사이 10 = 600 이다. 스크롤 막대 자리만큼 열이 조금 좁아진다 */
      #list {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        padding-right: 4px;
        margin-right: -10px;
        scrollbar-gutter: stable;
        grid-auto-rows: 104px;
        gap: 10px;
        align-content: start;
        overflow-y: auto;
        min-height: 0;
      }
      #list::-webkit-scrollbar {
        width: 6px;
      }
      #list::-webkit-scrollbar-thumb {
        border-radius: 3px;
        background: var(--line);
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .card:hover {
        background: var(--accent-bg);
      }
      .card:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      /* 고른 카드 — 옅은 배경만. 선택 막대·색 테두리로 강조하지 않는다 */
      .card[aria-pressed="true"] {
        background: var(--accent-bg);
      }
      /* 초상 자리 — 관리 창과 같은 원. 그림은 아직 넣지 않는다 */
      .portrait {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--accent-bg);
      }
      /* 그림 자리표시 — 받는 동안 빈 원이 천천히 밝아졌다 어두워진다. 끝내 못 받으면(.no-art) 빈 원으로 멈춘다.
         가운데 점은 두지 않는다 (2026-09-27 사용자 결정 "a로", Figma 99 시안 629:16748 A) */
      .portrait:not(.has-art):not(.no-art) {
        animation: portrait-wait 1.2s ease-in-out infinite alternate;
      }
      @keyframes portrait-wait {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .portrait:not(.has-art):not(.no-art) {
          animation: none;
        }
      }
      /* 초상 그림이 오면 원을 채운다. PokeAPI 기본 그림(96 × 96)의 둘레 여백은 잘라 낸다 */
      .portrait.has-art {
        overflow: hidden;
      }
      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-view-box: inset(14%);
      }
      .name {
        font-size: 12px;
        line-height: normal;
        font-weight: 500;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 36px;
      }
      #chosen {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #chosen-name {
        font-size: 15px;
        font-family: var(--font-large);
        line-height: normal;
        font-weight: 500;
      }
      #chosen-note {
        color: var(--muted);
        font-size: 12px;
        line-height: normal;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #start {
        flex: none;
        width: 120px;
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--inverse);
        font: inherit;
        font-size: 12px;
        line-height: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      #start:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      #start:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      #start:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
    </header>
    <div id="list" role="group"></div>
    <footer>
      <div id="chosen" aria-live="polite">
        <div id="chosen-name" hidden></div>
        <div id="chosen-note"></div>
      </div>
      <button id="start" type="button" disabled></button>
    </footer>
    <script type="module" src="../../dist/web/renderer/picker.js"></script>
  </body>
</html>
